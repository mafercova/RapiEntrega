name: Verificar Java 21
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar flujo HTTP con procesos Java y H2
        run: python pruebas/flujo-local.py
