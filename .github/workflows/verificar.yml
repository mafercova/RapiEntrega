name: Verificar Java 21
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar aislamiento del script de MySQL
        run: sh pruebas/test-init.sh
      - run: mvn -B verify
  flujo-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          for key in MYSQL_ROOT_PASSWORD CATALOGO_DB_PASSWORD PEDIDOS_DB_PASSWORD PAGOS_DB_PASSWORD LOGISTICA_DB_PASSWORD FACTURACION_DB_PASSWORD CALIFICACIONES_DB_PASSWORD RABBITMQ_PASSWORD; do
            echo "$key=$(openssl rand -hex 24)" >> .env
          done
          echo RABBITMQ_USER=rapientrega >> .env
      - run: docker compose up -d --build
      - run: python pruebas/smoke.py
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-compose
          path: compose.log
      - if: always()
        run: docker compose down
