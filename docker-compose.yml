services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecutar preparar-entorno.ps1}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?Definir contraseña}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Definir contraseña}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD:?Definir contraseña}
      LOGISTICA_DB_PASSWORD: ${LOGISTICA_DB_PASSWORD:?Definir contraseña}
      FACTURACION_DB_PASSWORD: ${FACTURACION_DB_PASSWORD:?Definir contraseña}
      CALIFICACIONES_DB_PASSWORD: ${CALIFICACIONES_DB_PASSWORD:?Definir contraseña}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./pruebas/sql/01-usuarios.sh:/docker-entrypoint-initdb.d/01-usuarios.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && exec rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Definir contraseña}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  catalogo:
    build:
      context: .
      args:
        MODULE: servicios/catalogo-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/catalogo
      DB_USER: catalogo
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  pedidos:
    build:
      context: .
      args:
        MODULE: servicios/pedidos-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos
      DB_USER: pedidos
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  pagos:
    build:
      context: .
      args:
        MODULE: servicios/pagos-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pagos
      DB_USER: pagos
      DB_PASSWORD: ${PAGOS_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  logistica:
    build:
      context: .
      args:
        MODULE: servicios/logistica-service
    environment:
      WEBSOCKET_RELAY: "true"
      DB_URL: jdbc:mysql://mysql:3306/logistica
      DB_USER: logistica
      DB_PASSWORD: ${LOGISTICA_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  facturacion:
    build:
      context: .
      args:
        MODULE: servicios/facturacion-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/facturacion
      DB_USER: facturacion
      DB_PASSWORD: ${FACTURACION_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8085:8085"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  calificaciones:
    build:
      context: .
      args:
        MODULE: servicios/calificaciones-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/calificaciones
      DB_USER: calificaciones
      DB_PASSWORD: ${CALIFICACIONES_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rapientrega}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOGO_URL: http://catalogo:8081
      PEDIDOS_URL: http://pedidos:8082
      PASARELA_URL: http://pasarela-mock:8091
      LEGADO_URL: http://facturacion-legado-mock:8092
    ports: ["127.0.0.1:8086:8086"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  pasarela-mock:
    build:
      context: .
      args:
        MODULE: integraciones/pasarela-mock
    ports: ["127.0.0.1:8091:8091"]
  facturacion-legado-mock:
    build:
      context: .
      args:
        MODULE: integraciones/facturacion-legado-mock
    ports: ["127.0.0.1:8092:8092"]
volumes:
  mysql-data:
