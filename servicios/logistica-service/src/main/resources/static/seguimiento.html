<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento · RapiEntrega</title><style>body{font:18px system-ui;background:#f4f6f8;color:#183241;max-width:680px;margin:60px auto;padding:24px}section{background:white;border-radius:16px;padding:30px}input,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}button{background:#087d75;color:white;border:0;border-radius:6px}#estado{color:#46616b}dl{line-height:1.8}</style><section><h1>Sigue tu entrega</h1><label for="pedido">Número de pedido</label><p><input id="pedido" size="38"><button id="ver">Consultar</button></p><p id="estado">Ingresa tu pedido para ver su ubicación.</p><dl id="posicion"></dl></section><script>
let socket;const $=id=>document.getElementById(id);$('pedido').value=new URLSearchParams(location.search).get('pedidoId')||'';
function mostrar(p){$('posicion').replaceChildren();for(const [k,v] of Object.entries({Estado:p.estado,Latitud:p.latitud,Longitud:p.longitud,'Actualizado':p.receivedAt||'Sin posiciones recibidas'})){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;$('posicion').append(dt,dd);}}
$('ver').onclick=async()=>{const id=$('pedido').value.trim();if(!/^[a-zA-Z0-9-]{1,128}$/.test(id)){$('estado').textContent='Revisa el número de pedido.';return;}if(socket)socket.close();try{let r=await fetch('/api/v1/asignaciones/'+encodeURIComponent(id));if(!r.ok)throw Error();mostrar(await r.json());socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onopen=()=>socket.send('CONNECT\naccept-version:1.2\nhost:/\nheart-beat:0,0\n\n\0');socket.onmessage=e=>{let raw=e.data;if(raw.startsWith('CONNECTED')){socket.send('SUBSCRIBE\nid:posicion\ndestination:/topic/pedidos/'+id+'\nack:auto\n\n\0');$('estado').textContent='Seguimiento conectado.';}if(raw.startsWith('MESSAGE')){let body=JSON.parse(raw.slice(raw.indexOf('\n\n')+2).replace(/\0$/,''));mostrar({...body,estado:'En camino'});}};socket.onclose=()=>{$('estado').textContent='Conexión cerrada. Pulsa Consultar para actualizar.';};}catch(e){$('estado').textContent='No se pudo consultar el pedido. Intenta de nuevo.';}};
</script></html>
