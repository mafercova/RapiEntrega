server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8083}
spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pagos}
    username: ${DB_USER:pagos}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
app:
  eventos-habilitados: ${EVENTOS_HABILITADOS:true}
  catalogo-url: ${CATALOGO_URL:http://localhost:8081}
  pedidos-url: ${PEDIDOS_URL:http://localhost:8082}
  pagos-url: ${PAGOS_URL:http://localhost:8083}
  logistica-url: ${LOGISTICA_URL:http://localhost:8084}
  facturacion-url: ${FACTURACION_URL:http://localhost:8085}
  calificaciones-url: ${CALIFICACIONES_URL:http://localhost:8086}
  pasarela-url: ${PASARELA_URL:http://localhost:8091}
  legado-url: ${LEGADO_URL:http://localhost:8092}
